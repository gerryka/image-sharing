# Baut den macOS-Client (Menüleisten-App, ad-hoc signiert, nicht notarisiert).
# Läuft die Core-Tests inkl. Integrationstests gegen den echten Server (tools/devserver).
# Push auf main bzw. Pull Request: ImgShare-mac.zip als Build-Artefakt (14 Tage abrufbar).
# Tag v* (z. B. v1.2.0): zusätzlich Upload ins GitHub-Release.
name: macOS-Client

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Neueste Xcode-Version wählen (mind. 27)
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Dev-Server starten
        run: |
          go build -o devserver ./tools/devserver
          ./devserver -addr 127.0.0.1:47001 > devserver1.log 2>&1 &
          ./devserver -addr 127.0.0.1:47002 -drop-after 2s > devserver2.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:47001/healthz && curl -sf http://127.0.0.1:47002/healthz && break; sleep 1; done

      - name: Tests
        env:
          IMGSHARE_TEST_SERVER: http://127.0.0.1:47001
          IMGSHARE_TEST_SERVER_FLAKY: http://127.0.0.1:47002
        run: swift test --package-path client-mac

      - name: Version bestimmen
        id: ver
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.${GITHUB_RUN_NUMBER}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: App bauen
        run: |
          brew install xcodegen
          cd client-mac
          xcodegen --quiet
          xcodebuild -project ImgShareMac.xcodeproj -scheme ImgShareMac -configuration Release \
            -derivedDataPath build \
            IMGSHARE_DEFAULT_SERVER="${{ vars.IMGSHARE_DEFAULT_SERVER }}" \
            MARKETING_VERSION="${{ steps.ver.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGN_IDENTITY=- build

      - name: Paketieren
        run: |
          app=client-mac/build/Build/Products/Release/ImgShare.app
          mkdir -p release dmgroot
          ditto -c -k --keepParent "$app" release/ImgShare-mac.zip
          # DMG mit Verknüpfung zum Programme-Ordner (Drag & Drop-Installation)
          ditto "$app" dmgroot/ImgShare.app
          ln -s /Applications dmgroot/Programme
          hdiutil create -volname ImgShare -srcfolder dmgroot -fs HFS+ -format UDZO -ov release/ImgShare-mac.dmg
          cd release
          for f in ImgShare-mac.zip ImgShare-mac.dmg; do shasum -a 256 "$f" > "$f.sha256"; cat "$f.sha256"; done
          du -h ImgShare-mac.*

      - uses: actions/upload-artifact@v4
        with:
          name: ImgShare-mac-${{ steps.ver.outputs.version }}
          path: release/*
          retention-days: 14

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release anlegen oder ergänzen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="**ImgShare-mac.dmg** (oder .zip) ist die macOS-Menüleisten-App (nicht notarisiert, siehe README: erster Start)."
          # Der Windows-Workflow läuft parallel und legt das Release evtl. gleichzeitig an:
          # Anlegen versuchen, sonst (oder bei Wettlauf) hochladen.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
             || ! gh release create "$GITHUB_REF_NAME" dist/* \
                    --repo "$GITHUB_REPOSITORY" \
                    --title "ImgShare $GITHUB_REF_NAME" \
                    --notes "$notes" --generate-notes; then
            sleep 5
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          fi
