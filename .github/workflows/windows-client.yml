# Baut den Windows-Client in zwei Varianten:
#  - ImgShare.exe     self-contained Single-File, läuft ohne Installation. Bewusst
#                     unkomprimiert: komprimierte Anhänge wirken auf Virenscanner wie ein Packer.
#  - ImgShare-fx.zip  normales .NET-Layout (EXE + DLLs), braucht die .NET 10 Desktop Runtime.
#                     Kein Single-File-Bündel, weil an EXEs angehängte Daten Heuristiken triggern.
# Push auf main bzw. Pull Request: Dateien als Build-Artefakt (14 Tage abrufbar).
# Tag v* (z. B. v1.2.0): zusätzlich GitHub-Release mit beiden Dateien und SHA-256-Prüfsummen.
name: Windows-Client

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - variant: standalone
            file: ImgShare.exe
            args: --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          - variant: fx
            file: ImgShare-fx.zip
            args: --self-contained false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Version bestimmen
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $v = $env:GITHUB_REF_NAME.TrimStart('v') }
          else { $v = "0.0.0-ci.$env:GITHUB_RUN_NUMBER" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Publish
        shell: pwsh
        run: >
          dotnet publish client/ImgShare/ImgShare.csproj
          -c Release -r win-x64
          ${{ matrix.args }}
          -p:DebugType=None -p:DebugSymbols=false
          -p:Version=${{ steps.ver.outputs.version }}
          "-p:DefaultServer=${{ vars.IMGSHARE_DEFAULT_SERVER }}"
          -o out

      - name: Verpacken und Prüfsumme
        shell: pwsh
        run: |
          $f = "${{ matrix.file }}"
          New-Item -ItemType Directory -Force release | Out-Null
          if ($f.EndsWith('.zip')) {
            Get-ChildItem out
            Compress-Archive -Path out/* -DestinationPath "release/$f"
          } else {
            Copy-Item out/ImgShare.exe "release/$f"
          }
          $h = (Get-FileHash "release/$f" -Algorithm SHA256).Hash.ToLower()
          "$h  $f" | Out-File -Encoding ascii "release/$f.sha256"
          Get-Content "release/$f.sha256"
          "{0:N1} MB" -f ((Get-Item "release/$f").Length / 1MB)

      - uses: actions/upload-artifact@v4
        with:
          name: ImgShare-${{ matrix.variant }}-${{ steps.ver.outputs.version }}
          path: release/*
          retention-days: 14

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release anlegen oder ergänzen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="**ImgShare.exe** läuft ohne Installation. **ImgShare-fx.zip** ist die kleine Variante (entpacken, ImgShare.exe starten) und braucht die [.NET 10 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/10.0) (x64)."
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "ImgShare $GITHUB_REF_NAME" \
              --notes "$notes" --generate-notes
          fi
