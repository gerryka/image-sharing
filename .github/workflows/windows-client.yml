# Baut den Windows-Client in zwei Varianten:
#  - ImgShare.exe     self-contained, läuft ohne Installation (~73 MB)
#  - ImgShare-fx.exe  braucht die .NET 10 Desktop Runtime (~0,5 MB)
# Push auf main bzw. Pull Request: EXEs als Build-Artefakt (14 Tage abrufbar).
# Tag v* (z. B. v1.2.0): zusätzlich GitHub-Release mit beiden EXEs und SHA-256-Prüfsummen.
name: Windows-Client

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - variant: standalone
            exe: ImgShare.exe
            args: --self-contained true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true
          - variant: fx
            exe: ImgShare-fx.exe
            args: --self-contained false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Version bestimmen
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $v = $env:GITHUB_REF_NAME.TrimStart('v') }
          else { $v = "0.0.0-ci.$env:GITHUB_RUN_NUMBER" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Publish
        shell: pwsh
        run: >
          dotnet publish client/ImgShare/ImgShare.csproj
          -c Release -r win-x64 -p:PublishSingleFile=true
          ${{ matrix.args }}
          -p:Version=${{ steps.ver.outputs.version }}
          "-p:DefaultServer=${{ vars.IMGSHARE_DEFAULT_SERVER }}"
          -o out

      - name: Umbenennen und Prüfsumme
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item out/ImgShare.exe "release/${{ matrix.exe }}"
          $h = (Get-FileHash "release/${{ matrix.exe }}" -Algorithm SHA256).Hash.ToLower()
          "$h  ${{ matrix.exe }}" | Out-File -Encoding ascii "release/${{ matrix.exe }}.sha256"
          Get-Content "release/${{ matrix.exe }}.sha256"
          "{0:N1} MB" -f ((Get-Item "release/${{ matrix.exe }}").Length / 1MB)

      - uses: actions/upload-artifact@v4
        with:
          name: ImgShare-${{ matrix.variant }}-${{ steps.ver.outputs.version }}
          path: release/*
          retention-days: 14

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release anlegen oder ergänzen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="**ImgShare.exe** läuft ohne Installation. **ImgShare-fx.exe** ist die kleine Variante und braucht die [.NET 10 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/10.0) (x64)."
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "ImgShare $GITHUB_REF_NAME" \
              --notes "$notes" --generate-notes
          fi
